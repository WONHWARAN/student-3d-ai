services:
  - type: web
    name: student-3d-ai
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3000"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: MAX_UPLOAD_MB
        value: "8"
      - key: MESHY_API_KEY
        sync: false
